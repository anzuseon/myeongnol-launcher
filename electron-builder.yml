appId: 'kr.myeongnol.launcher'
productName: '명선놀이터 시즌3'
artifactName: 'Myeongnol-Launcher-Setup-${version}.${ext}'

copyright: 'Copyright © 2026 Anzu'

asar: true
compression: 'maximum'

files:
  - '!{dist,.gitignore,.vscode,docs,test,dev-app-update.yml,.nvmrc,eslint.config.mjs}'

extraResources:
  - 'libraries'

win:
  icon: 'build/icon.ico'
  target:
    - target: 'nsis'
      arch: 'x64'

nsis:
  installerIcon: 'build/icon.ico'
  uninstallerIcon: 'build/icon.ico'
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

directories:
  buildResources: 'build'
  output: 'dist'
