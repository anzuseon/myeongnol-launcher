name: Build

on: push

jobs:
  release:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Install Dependencies
        run: npm ci
        shell: bash

      - name: Build
        run: npm run dist:win -- --publish never

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $notesPath = "docs/releases/v$version.md"
          if (!(Test-Path -LiteralPath $notesPath)) {
            throw "Release notes are missing: $notesPath"
          }
          gh release create "${{ github.ref_name }}" `
            "dist/latest.yml" `
            "dist/Myeongnol-Launcher-Setup-$version.exe" `
            "dist/Myeongnol-Launcher-Setup-$version.exe.blockmap" `
            --title "명선놀이터 시즌3 런처 ${{ github.ref_name }}" `
            --notes-file $notesPath
